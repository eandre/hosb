[project]
name = "community"
version = "0.1.0"
description = "House of Soft Beasts community calendar: events and RSVPs for members"
requires-python = ">=3.14"
dependencies = [
    # Encore's SDK, the version of the Encore that runs the app (2.0.0-beta.10).
    "encore-dev==2.0.0b10",
    "fastapi>=0.143",
    # Verifies Clerk session tokens (RS256 JWTs) against the instance's public key.
    "pyjwt[crypto]>=2.10",
    # Time zone data, for events' dates in Stockholm: slim images have none.
    "tzdata>=2025.2",
    # Calls Google's OAuth and Calendar APIs.
    "httpx>=0.28",
    # Encrypts members' Google tokens in the database (Fernet).
    "cryptography>=44",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
# Prefer an installed Python to one uv manages: uv's managed 3.14 may be the
# free-threaded build, which Encore's runtime isn't built for everywhere.
python-preference = "system"


[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
